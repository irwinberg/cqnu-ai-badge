server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 64k;
    root /var/www/cqnu;
    location = / { return 302 /points/; }
    location /points/ { try_files $uri $uri/ =404; }
    location /board/ { try_files $uri $uri/ =404; }
    location /dl/ { autoindex off; }
    location ~ ^/(api|m|admin|healthz) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
